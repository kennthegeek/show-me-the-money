[project]
name = "dropship-pipeline"
version = "1.0.0"
description = "Shopify <-> supplier (CJ Dropshipping) automation: sourcing, inventory sync, order routing, tracking"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
dropship = "dropship.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dropship*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B027"]

[tool.pytest.ini_options]
testpaths = ["tests"]
